name: fixtures smoke
# Run by hand to check the fixtures Action end to end (each run is one call to the service).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: fx
        # Pinned to the commit of the latest release tag (CSO F4); move it with each release.
        uses: meiorz/rowsmith-mcp/fixtures@d454038172a46e273630bba34b9fca3bde7ad52d # v0.5.0
        with:
          schema: examples/quickstart-schema.json
          seed: "42"
          rows: "20"
          format: csv
          out: orders.csv
          # Our own test run: the service counts it as team traffic, not as an outside caller (cycle 8 A2).
          extra-header: "x-rowsmith-team: ci"
      - run: |
          head -3 orders.csv
          test "$(sed -n 2p orders.csv | cut -d, -f1)" = "ord_0001"
          echo "generator ${{ steps.fx.outputs.generator-version }}"
