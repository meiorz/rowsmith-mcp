# Runs rowsmith-mcp's tests (test/*.test.js, offline: the service is faked) on push to main and by hand. No secrets
# and no publish step: an npm publish and its v* tag follow only after this workflow is green on the commit (cycle 7).
# Uses the runner's preinstalled Node (>= 20, printed below); actions are pinned to full commit SHAs.
name: rowsmith-mcp-test
on:
  push:
    branches:
      - main
    paths:
      - "index.js"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - "scripts/**"
      - ".github/workflows/rowsmith-mcp-test.yml"
  workflow_dispatch:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node version (engines requires >= 20)
        run: |
          node --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
      - name: Install the locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests
        run: npm test
